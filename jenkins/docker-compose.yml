services:
  jenkins:
    build: .
    image: jenkins-ai-lab:latest
    container_name: jenkins
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx768m -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - ..:/repo:ro
    restart: unless-stopped

volumes:
  jenkins_home: